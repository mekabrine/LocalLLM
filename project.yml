name: LocalLLM
options:
  bundleIdPrefix: com.mekabrine
  deploymentTarget:
    iOS: "16.1"
  xcodeVersion: "16.4"

packages:
  SwiftLlama:
    url: https://github.com/ShenghaiWang/SwiftLlama.git
    from: 0.4.0

targets:
  LocalGGUFChat:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: LocalGGUFChat
        excludes:
          - "**/*.md"
    resources:
      - path: LocalGGUFChat/Resources
    info:
      path: LocalGGUFChat/Resources/Info.plist
    settings:
      base:
        PRODUCT_NAME: LocalLLM
        PRODUCT_BUNDLE_IDENTIFIER: com.mekabrine.localllm
        MARKETING_VERSION: "1.36"
        CURRENT_PROJECT_VERSION: "37"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.1"
    dependencies:
      - package: SwiftLlama
