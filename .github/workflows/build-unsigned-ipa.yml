name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare patched SwiftLlama
        run: python3 scripts/prepare_local_swiftllama.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LocalLLM.xcodeproj \
            -scheme LocalGGUFChat

      - name: Build app without signing
        run: |
          set -euo pipefail
          xcodebuild clean build \
            -project LocalLLM.xcodeproj \
            -scheme LocalGGUFChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Verify no prebuilt llama framework is embedded
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found."
            exit 1
          fi
          if find "$APP_PATH/Frameworks" -name 'llama.framework' -print -quit 2>/dev/null | grep -q .; then
            echo "Error: prebuilt llama.framework is embedded and can crash before app launch."
            find "$APP_PATH/Frameworks" -name 'llama.framework' -print
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found."
            exit 1
          fi

          rm -rf build/Payload build/LocalLLM-unsigned.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/LocalLLM.app
          (cd build && zip -qry LocalLLM-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: LocalLLM-unsigned-ipa
          path: build/LocalLLM-unsigned.ipa
          if-no-files-found: error
